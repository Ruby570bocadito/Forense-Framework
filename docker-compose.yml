# docker compose up -d   ->  http://127.0.0.1:8765  (user: any, password: FORENSE_WEB_PASSWORD)
services:
  forense:
    build: .
    image: forense-framework
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      FORENSE_WEB_PASSWORD: ${FORENSE_WEB_PASSWORD:-change-me}
      FORENSE_LANG: ${FORENSE_LANG:-es}
    volumes:
      - ./cases:/cases
      - ./config:/config
      - ${EVIDENCE_DIR:-./evidence}:/evidence:ro
    restart: unless-stopped
