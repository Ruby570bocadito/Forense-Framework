# docker compose up -d   ->  http://127.0.0.1:8765  (user: any, password: SABUESO_WEB_PASSWORD)
services:
  sabueso:
    build: .
    image: sabueso-framework
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SABUESO_WEB_PASSWORD: ${SABUESO_WEB_PASSWORD:-change-me}
      SABUESO_LANG: ${SABUESO_LANG:-es}
    volumes:
      - ./cases:/cases
      - ./config:/config
      - ${EVIDENCE_DIR:-./evidence}:/evidence:ro
    restart: unless-stopped
