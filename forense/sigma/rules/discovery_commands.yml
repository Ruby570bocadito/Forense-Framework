title: Account and domain discovery commands
id: 16cc6388-4741-572a-9041-1c8860a57c35
status: experimental
description: 'Reconnaissance commands typically run right after an intruder gains access.'
author: Forense-Framework
date: 2026-10-04
tags:
    - attack.discovery
    - attack.t1087
    - attack.t1482
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'whoami /all'
            - 'whoami /priv'
            - 'net group "domain admins"'
            - 'net group "enterprise admins"'
            - 'net user /domain'
            - 'nltest /dclist'
            - 'nltest /domain_trusts'
            - 'Get-ADUser -Filter'
    condition: selection
falsepositives:
    - Legitimate administration; review the surrounding activity.
level: low
