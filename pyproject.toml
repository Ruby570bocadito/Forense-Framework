[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forense-framework"
dynamic = ["version"]
description = "Windows digital forensics framework: cases, chain of custody, artifact analysis, timeline, web UI and reports (ES/EN)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Forense-Framework contributors" }]
dependencies = [
    "evtx>=0.8",                      # Windows event logs (Rust parser, prebuilt wheels)
    "Flask>=2.3",                     # web interface (brings Jinja2, also used for reports)
    "PyYAML>=6.0",                    # Sigma rules
    "olefile>=0.46",                  # automatic jump lists (OLE compound files)
    "libscca-python>=20240427",       # Prefetch, including Windows 10/11 compressed files
    "libesedb-python>=20240420",      # SRUM (ESE databases)
    "libewf-python>=20240506",        # E01 images
    "pytsk3>=20231007",               # NTFS and partition tables (The Sleuth Kit)
    "yara-x>=0.10",                   # YARA rules
]
keywords = ["forensics", "dfir", "windows", "evtx", "registry", "timeline", "chain of custody", "forense"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Natural Language :: Spanish",
    "Natural Language :: English",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
memory = ["volatility3>=2.7"]

[project.scripts]
forense = "forense.cli:main"

[tool.setuptools.dynamic]
version = { attr = "forense.__version__" }

[tool.setuptools.packages.find]
include = ["forense*"]

[tool.setuptools.package-data]
forense = ["locales/*.json", "report/templates/*.html", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008"]
