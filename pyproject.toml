[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forense-framework"
dynamic = ["version"]
description = "Windows digital forensics framework: cases, chain of custody, artifact analysis, timeline, web UI and reports (ES/EN)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "evtx>=0.8",      # Windows event log parser (Rust, prebuilt wheels)
    "Flask>=2.3",     # web interface (brings Jinja2, also used for reports)
]
keywords = ["forensics", "dfir", "windows", "evtx", "registry", "timeline", "chain of custody", "forense"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Natural Language :: Spanish",
    "Natural Language :: English",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
forense = "forense.cli:main"

[tool.setuptools.dynamic]
version = { attr = "forense.__version__" }

[tool.setuptools.packages.find]
include = ["forense*"]

[tool.setuptools.package-data]
forense = ["locales/*.json", "report/templates/*.html", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008"]
