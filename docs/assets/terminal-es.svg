<text x="24" y="52" class="cmd l0" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso</text><text x="24" y="71" class="out l1" xml:space="preserve">       __      Sabueso 0.4.1</text><text x="24" y="90" class="out l2" xml:space="preserve">  (___()&#x27;`;    Análisis forense de Windows con cadena de custodia</text><text x="24" y="109" class="out l3" xml:space="preserve">  /,    /`     Sigue el rastro. Las conclusiones, tuyas.</text><text x="24" y="128" class="out l4" xml:space="preserve">  \\&quot;--\\</text><text x="24" y="166" class="out l5" xml:space="preserve">Para empezar:</text><text x="24" y="185" class="hint l6" xml:space="preserve">  sabueso demo ./laboratorio                             crea un caso de ejemplo y lo analiza</text><text x="24" y="204" class="hint l7" xml:space="preserve">  sabueso web -w ./laboratorio --abrir                   ábrelo en el navegador</text><text x="24" y="223" class="hint l8" xml:space="preserve">  sabueso nuevo ./caso01 -n &quot;Intrusión&quot; -i &quot;Tu nombre&quot;   abre un caso real</text><text x="24" y="242" class="hint l9" xml:space="preserve">  sabueso auto disco.E01 --nuevo ./caso02                de la evidencia al informe con una orden</text><text x="24" y="261" class="hint l10" xml:space="preserve">  sabueso doctor                                         comprueba la instalación</text><text x="24" y="299" class="out l11" xml:space="preserve">Todas las órdenes: sabueso --help    Documentación: https://github.com/Ruby570bocadito/Sabueso-Framework</text><text x="24" y="52" class="cmd l12" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso demo lab -a &quot;R. García&quot;</text><text x="24" y="71" class="out l13" xml:space="preserve">Evidencias de demostración creadas en lab\evidence</text><text x="24" y="90" class="out l14" xml:space="preserve">Caso de demostración analizado en lab\case_demo: 62 hallazgos, 250 eventos.</text><text x="24" y="128" class="cmd l15" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso -c lab/case_demo hallazgos --severidad critical</text><text x="24" y="147" class="out l16" xml:space="preserve">#   Severidad  Fecha               Evidencia  Hallazgo            Descripción         Revisión          </text><text x="24" y="166" class="out l17" xml:space="preserve">--  ---------  ------------------  ---------  ------------------  ------------------  ------------------</text><text x="24" y="185" class="crit l18" xml:space="preserve">27  crítico    2026-09-14 02:58:…  EV-001     Depurador IFEO pa…  Al ejecutar sethc…  Pendiente de revi…</text><text x="24" y="204" class="crit l19" xml:space="preserve">51  crítico                        EV-001     YARA: sabueso_dem…  SABUESO-DEMO impl…  Pendiente de revi…</text><text x="24" y="223" class="out l20" xml:space="preserve">Revisados 0 de 62 hallazgos (0 confirmados, 0 falsos positivos).</text><text x="24" y="52" class="cmd l21" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso -c lab/case_demo mitre --resumen</text><text x="24" y="71" class="out l22" xml:space="preserve">Entre el 2026-09-14 02:22:00 y el 2026-09-14 04:42:00 (UTC) se observaron indicios de 8 tácticas y 24 t…</text><text x="24" y="90" class="out l23" xml:space="preserve">- Ejecución (2026-09-14 02:33:30): T1059 Command and Scripting Interpreter, T1059.001 PowerShell, T1053…</text><text x="24" y="109" class="out l24" xml:space="preserve">- Persistencia (2026-09-14 02:37:00): T1547.001 Registry Run Keys / Startup Folder, T1543.003 Windows S…</text><text x="24" y="128" class="out l25" xml:space="preserve">- Escalada de privilegios (2026-09-14 02:37:00): T1547.001 Registry Run Keys / Startup Folder, T1543.00…</text><text x="24" y="147" class="out l26" xml:space="preserve">- Evasión de defensas (2026-09-14 02:33:30): T1027 Obfuscated Files or Information, T1564.003 Hidden Wi…</text><text x="24" y="166" class="out l27" xml:space="preserve">…</text><text x="24" y="204" class="cmd l28" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso -c lab/case_demo info</text><text x="24" y="223" class="out l29" xml:space="preserve">Evidencias: 3   Análisis: 23   Eventos en la línea temporal: 250   Hallazgos: 62</text><text x="24" y="242" class="crit l30" xml:space="preserve">  crítico: 2  alto: 33  medio: 17  bajo: 9  informativo: 1</text><text x="24" y="280" class="next l31" xml:space="preserve">Siguiente paso: revisa los hallazgos (62 de 62 pendientes).</text><text x="24" y="299" class="hint l32" xml:space="preserve">  sabueso -c &quot;lab/case_demo&quot; hallazgos</text><text x="24" y="318" class="hint l33" xml:space="preserve">  sabueso -c &quot;lab/case_demo&quot; revisar N confirmado|falso_positivo</text>
</svg>
