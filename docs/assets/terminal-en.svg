<text x="24" y="52" class="cmd l0" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso -L en</text><text x="24" y="71" class="out l1" xml:space="preserve">       __      Sabueso 0.4.1</text><text x="24" y="90" class="out l2" xml:space="preserve">  (___()&#x27;`;    Windows forensics with a chain of custody</text><text x="24" y="109" class="out l3" xml:space="preserve">  /,    /`     Follow the trail. The conclusions are yours.</text><text x="24" y="128" class="out l4" xml:space="preserve">  \\&quot;--\\</text><text x="24" y="166" class="out l5" xml:space="preserve">To get started:</text><text x="24" y="185" class="hint l6" xml:space="preserve">  sabueso demo ./lab                                   builds a sample case and analyses it</text><text x="24" y="204" class="hint l7" xml:space="preserve">  sabueso web -w ./lab --open                          opens it in the browser</text><text x="24" y="223" class="hint l8" xml:space="preserve">  sabueso new ./case01 -n &quot;Intrusion&quot; -i &quot;Your name&quot;   opens a real case</text><text x="24" y="242" class="hint l9" xml:space="preserve">  sabueso auto disk.E01 --new ./case02                 from evidence to report in one command</text><text x="24" y="261" class="hint l10" xml:space="preserve">  sabueso doctor                                       checks the installation</text><text x="24" y="299" class="out l11" xml:space="preserve">All commands: sabueso --help    Documentation: https://github.com/Ruby570bocadito/Sabueso-Framework</text><text x="24" y="52" class="cmd l12" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso demo lab -a &quot;R. Garcia&quot; -L en</text><text x="24" y="71" class="out l13" xml:space="preserve">Demo evidence created at lab\evidence</text><text x="24" y="90" class="out l14" xml:space="preserve">Demo case analysed at lab\case_demo: 62 findings, 250 events.</text><text x="24" y="128" class="cmd l15" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso -c lab/case_demo findings --severity critical -L en</text><text x="24" y="52" class="cmd l16" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso -c lab/case_demo attack --summary -L en</text><text x="24" y="71" class="out l17" xml:space="preserve">Between 2026-09-14 02:22:00 and 2026-09-14 04:42:00 (UTC), evidence of 8 tactics and 24 MITRE ATT&amp;CK te…</text><text x="24" y="90" class="out l18" xml:space="preserve">- Execution (2026-09-14 02:33:30): T1059 Command and Scripting Interpreter, T1059.001 PowerShell, T1053…</text><text x="24" y="109" class="out l19" xml:space="preserve">- Persistence (2026-09-14 02:37:00): T1547.001 Registry Run Keys / Startup Folder, T1543.003 Windows Se…</text><text x="24" y="128" class="out l20" xml:space="preserve">- Privilege escalation (2026-09-14 02:37:00): T1547.001 Registry Run Keys / Startup Folder, T1543.003 W…</text><text x="24" y="147" class="out l21" xml:space="preserve">- Defense evasion (2026-09-14 02:33:30): T1027 Obfuscated Files or Information, T1564.003 Hidden Window…</text><text x="24" y="166" class="out l22" xml:space="preserve">…</text><text x="24" y="204" class="cmd l23" xml:space="preserve"><tspan class="ps">$ </tspan>sabueso -c lab/case_demo info -L en</text><text x="24" y="223" class="out l24" xml:space="preserve">Evidence: 3   Analyses: 23   Timeline events: 250   Findings: 62</text><text x="24" y="242" class="crit l25" xml:space="preserve">  critical: 2  high: 33  medium: 17  low: 9  info: 1</text><text x="24" y="280" class="next l26" xml:space="preserve">Next step: review the findings (62 of 62 pending).</text><text x="24" y="299" class="hint l27" xml:space="preserve">  sabueso -c &quot;lab/case_demo&quot; findings</text><text x="24" y="318" class="hint l28" xml:space="preserve">  sabueso -c &quot;lab/case_demo&quot; review N confirmed|false_positive</text>
