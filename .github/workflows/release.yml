name: release

# A tag such as v0.4.0 publishes: the wheel and sdist, a standalone Windows build
# (no Python needed) and the container image on GitHub Container Registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Check the wheel installs and contains its data
        run: |
          python -m pip install dist/*.whl
          forense --version
          forense doctor
          python -c "import zipfile, glob; n = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert any('sigma/rules/' in x for x in n) and any('web/templates/' in x for x in n)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install . pyinstaller
          pyinstaller packaging/forense.spec --noconfirm
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "dist\forense\forense.exe"
          & $exe --version
          & $exe doctor
          if ($LASTEXITCODE) { exit 1 }
          & $exe demo smoke -a CI
          & $exe -c smoke\case_demo verify
          & $exe -c smoke\case_demo report --lang es --pdf
          if ($LASTEXITCODE) { exit 1 }
          & $exe -c smoke\case_demo export stix -o smoke\iocs.json
      - name: Package
        shell: pwsh
        run: |
          $version = (python -c "import forense; print(forense.__version__)")
          Compress-Archive -Path dist\forense -DestinationPath "forense-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: forense-*-windows-x64.zip

  container:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [python-dist, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
